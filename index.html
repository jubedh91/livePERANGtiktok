<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Perang Wilayah Kanvas - TikTok Live @milalala48</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #05070d; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.16), transparent 45%), radial-gradient(circle at 80% 85%, rgba(236, 72, 153, 0.14), transparent 45%), linear-gradient(180deg, #070913 0%, #030407 100%); }
    #stream-container { position: relative; width: 100%; height: 100vh; max-height: 100vh; aspect-ratio: 9/16; max-width: calc(100vh * (9/16)); background: #090d16; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 60px rgba(0, 0, 0, 0.95); }
    #start-overlay { position: absolute; inset: 0; z-index: 200; background: rgba(4, 7, 15, 0.92); backdrop-filter: blur(14px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; cursor: pointer; transition: opacity 0.3s ease, visibility 0.3s ease; }
    #start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .start-title { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #f59e0b; margin-bottom: 4px; }
    .btn-start-pulse { background: linear-gradient(135deg, #0284c7 0%, #ec4899 100%); color: #fff; font-size: 13px; font-weight: 900; padding: 14px 24px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center; gap: 10px; }
    #live-header { position: relative; z-index: 30; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; background: rgba(10, 14, 26, 0.8); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .badge-live { background: #ef4444; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 99px; }
    .header-actions { display: flex; gap: 5px; }
    .btn-icon { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; width: 26px; height: 26px; border-radius: 7px; cursor: pointer; }
    #leaderboard-overlay { position: absolute; top: 48px; left: 8px; right: 8px; z-index: 25; background: rgba(13, 17, 28, 0.88); border-radius: 12px; padding: 7px 10px; }
    .lb-header { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 800; color: #fbbf24; margin-bottom: 5px; }
    .lb-row { display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.04); padding: 3px 6px; border-radius: 6px; margin-bottom: 4px; }
    .lb-avatar-img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .lb-info { flex: 1; }
    .lb-name { font-size: 10px; font-weight: 700; color: #f8fafc; }
    #vip-alert { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.7); width: 90%; z-index: 100; background: #dc2626; border: 2px solid #fef08a; border-radius: 16px; padding: 16px; text-align: center; opacity: 0; transition: all 0.3s; }
    #vip-alert.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .vip-headline { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    #canvas-wrapper { position: relative; flex: 1; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10; }
    #warCanvas { display: block; width: 100%; height: 100%; background: #05070d; }
    #event-ticker { position: absolute; bottom: 20px; left: 8px; right: 8px; z-index: 30; background: rgba(10, 14, 26, 0.88); border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #e2e8f0; }
  </style>
</head>
<body>
  <div id="stream-container">
    <div id="start-overlay">
      <div class="start-title">PERANG WILAYAH KANVAS</div>
      <button id="btn-start-game" class="btn-start-pulse">🔊 TAP UNTUK MEMULAI (AUTO FULLSCREEN)</button>
    </div>
    <header id="live-header">
      <div class="badge-live">LIVE</div>
      <div style="font-size:11.5px; font-weight:900; color:#f59e0b;">⚔️ PERANG WILAYAH</div>
      <div class="header-actions">
        <button id="btn-sound-toggle" class="btn-icon">🔊</button>
        <button id="btn-fs-toggle" class="btn-icon">🔲</button>
      </div>
    </header>
    <div id="leaderboard-overlay">
      <div class="lb-header"><span>👑 TOP PENGUASA</span><span id="lb-summary-stat" style="color:#94a3b8">375 Petak Total</span></div>
      <div id="lb-list-container"></div>
    </div>
    <div id="vip-alert"><div class="vip-headline" id="vip-title">SULTAN MENEMBAKKAN SENJATA!</div></div>
    <div id="canvas-wrapper"><canvas id="warCanvas"></canvas></div>
    <div id="event-ticker"><span id="ticker-msg">🔄 Menginisialisasi injeksi internal...</span></div>
  </div>

  <script>
    (function () {
      const COLS = 15; const ROWS = 25; const TOTAL_TILES = COLS * ROWS;
      let audioEnabled = true; let audioCtx = null; let ttsUnlocked = false;

      function getAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
      const TTS = { speak(text) { if (!audioEnabled || !('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'id-ID'; window.speechSynthesis.speak(u); } };
      const SoundFX = { playTap() { /* tap sound */ }, playRose() { /* rose sound */ }, playBomb() { /* bomb sound */ }, playMoneyGun() { /* money sound */ } };

      const ImageCache = { cache: new Map(), get(url) { if (!url) return null; if (this.cache.has(url)) { const img = this.cache.get(url); return (img.complete && img.naturalWidth > 0) ? img : null; } const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url; this.cache.set(url, img); return null; } };

      class Tile {
        constructor(col, row, index) { this.col = col; this.row = row; this.index = index; this.isOwned = false; this.uniqueId = ''; this.ownerName = ''; this.ownerAvatar = ''; this.ownerColor = '#1e293b'; this.isLocked = false; this.lockEndTime = 0; }
        claim(uid, name, av, col) { this.isOwned = true; this.uniqueId = uid; this.ownerName = name; this.ownerAvatar = av; this.ownerColor = col; }
        lock(durSec) { this.isLocked = true; this.lockEndTime = Date.now() + durSec * 1000; }
        checkLockExpiration(now) { if (this.isLocked && now >= this.lockEndTime) { this.isLocked = false; this.lockEndTime = 0; return true; } return false; }
      }

      function computeMergedSquares(grid) {
        const covered = Array.from({ length: ROWS }, () => Array(COLS).fill(false)); const merged = [];
        for (let k = Math.min(COLS, ROWS); k >= 2; k--) {
          for (let r = 0; r <= ROWS - k; r++) {
            for (let c = 0; c <= COLS - k; c++) {
              const base = grid[r * COLS + c]; if (!base.isOwned || covered[r][c]) continue;
              let isValid = true;
              for (let dr = 0; dr < k; dr++) { for (let dc = 0; dc < k; dc++) { const t = grid[(r + dr) * COLS + (c + dc)]; if (!t.isOwned || t.uniqueId !== base.uniqueId || !!t.isLocked !== !!base.isLocked || covered[r+dr][c+dc]) { isValid = false; break; } } if (!isValid) break; }
              if (isValid) {
                let maxLock = 0;
                for (let dr = 0; dr < k; dr++) { for (let dc = 0; dc < k; dc++) { covered[r+dr][c+dc] = true; const t = grid[(r+dr)*COLS + (c+dc)]; if (t.isLocked && t.lockEndTime > maxLock) maxLock = t.lockEndTime; } }
                merged.push({ col: c, row: r, size: k, uniqueId: base.uniqueId, ownerName: base.ownerName, ownerAvatar: base.ownerAvatar, ownerColor: base.ownerColor, isLocked: !!base.isLocked, lockEndTime: maxLock });
              }
            }
          }
        }
        for (let r = 0; r < ROWS; r++) { for (let c = 0; c < COLS; c++) { if (!covered[r][c]) { const t = grid[r*COLS + c]; if (t.isOwned) merged.push({ col: c, row: r, size: 1, uniqueId: t.uniqueId, ownerName: t.ownerName, ownerAvatar: t.ownerAvatar, ownerColor: t.ownerColor, isLocked: t.isLocked, lockEndTime: t.lockEndTime }); } } }
        return merged;
      }

      class TurfWarGame {
        constructor() {
          this.canvas = document.getElementById('warCanvas'); this.ctx = this.canvas.getContext('2d'); this.wrapper = document.getElementById('canvas-wrapper');
          this.grid = []; for (let r = 0; r < ROWS; r++) { for (let c = 0; c < COLS; c++) this.grid.push(new Tile(c, r, r * COLS + c)); }
          this.dpr = window.devicePixelRatio || 1; this.cachedMergedSquares = computeMergedSquares(this.grid); this.tapCounters = {};
          this.initResize(); this.initWebSocket(); this.startLoop();
          setInterval(() => { const now = Date.now(); let changed = false; this.grid.forEach(t => { if (t.checkLockExpiration(now)) changed = true; }); if (changed) this.onGridModified(); }, 300);
          document.getElementById('btn-sound-toggle').addEventListener('click', (e) => { audioEnabled = !audioEnabled; e.target.textContent = audioEnabled ? '🔊' : '🔇'; });
          document.getElementById('btn-fs-toggle').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); });
        }
        initResize() { const resize = () => { const rect = this.wrapper.getBoundingClientRect(); this.canvas.width = rect.width * this.dpr; this.canvas.height = rect.height * this.dpr; this.tileWidth = (rect.width * this.dpr) / COLS; this.tileHeight = (rect.height * this.dpr) / ROWS; }; window.addEventListener('resize', resize); resize(); }
        setTicker(text) { document.getElementById('ticker-msg').innerHTML = text; }
        
        triggerTap(uid, name, av, col, amt) {
          this.tapCounters[uid] = (this.tapCounters[uid] || 0) + amt; let claims = 0;
          while (this.tapCounters[uid] >= 50) { this.tapCounters[uid] -= 50; const empty = this.grid.filter(t => !t.isOwned && !t.isLocked); const target = empty.length > 0 ? empty[Math.floor(Math.random()*empty.length)] : this.grid.filter(t => !t.isLocked && t.uniqueId !== uid)[0]; if (target) { target.claim(uid, name, av, col); claims++; } }
          if (claims > 0) { this.setTicker(`👆 <b>${name}</b> tap mencapai kelipatan 50!`); this.onGridModified(); }
        }
        triggerGift(uid, name, av, col, gift) {
          const t = this.grid.filter(t => !t.isLocked && t.uniqueId !== uid);
          if(gift.includes('rose') || gift.includes('mawar')) { if(t.length>0) t[Math.floor(Math.random()*t.length)].claim(uid, name, av, col); this.setTicker(`🌹 ${name} mengirim Mawar!`); }
          else if(gift.includes('love') || gift.includes('cinta')) { this.grid.filter(t=>t.uniqueId===uid).slice(0,5).forEach(x=>x.lock(30)); this.setTicker(`🛡️ ${name} kebal 30 detik!`); }
          else if(gift.includes('money')) { for(let i=0;i<64&&i<t.length;i++) t[i].claim(uid, name, av, col); this.setTicker(`💸 ${name} meluncurkan SENJATA UANG (64 Petak)!`); document.getElementById('vip-alert').classList.add('active'); setTimeout(()=>document.getElementById('vip-alert').classList.remove('active'), 3000); }
          else { if(t.length>0) t[Math.floor(Math.random()*t.length)].claim(uid, name, av, col); }
          this.onGridModified();
        }
        
        onGridModified() {
          this.cachedMergedSquares = computeMergedSquares(this.grid);
          const counts = {}; let total = 0; this.grid.forEach(t => { if(t.isOwned) { total++; if(!counts[t.uniqueId]) counts[t.uniqueId]={name:t.ownerName, av:t.ownerAvatar, col:t.ownerColor, c:0}; counts[t.uniqueId].c++; }});
          const sorted = Object.values(counts).sort((a,b)=>b.c-a.c).slice(0,4);
          document.getElementById('lb-summary-stat').textContent = `${total}/${TOTAL_TILES} Petak`;
          document.getElementById('lb-list-container').innerHTML = sorted.map((p,i) => `<div class="lb-row"><span style="width:15px">${i+1}.</span><img class="lb-avatar-img" src="${p.av}"><span class="lb-name">${p.name}</span><span style="margin-left:auto;font-size:10px;font-weight:bold;color:${p.col}">${((p.c/TOTAL_TILES)*100).toFixed(1)}%</span></div>`).join('');
        }

        startLoop() { const loop = () => { this.render(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
        render() {
          const ctx = this.ctx; ctx.fillStyle = '#06080e'; ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
          this.grid.forEach(t => { if(!t.isOwned) { ctx.fillStyle='#090d16'; ctx.fillRect(t.col*this.tileWidth, t.row*this.tileHeight, this.tileWidth-1, this.tileHeight-1); }});
          this.cachedMergedSquares.forEach(sq => {
            const x=sq.col*this.tileWidth+1.5, y=sq.row*this.tileHeight+1.5, w=sq.size*this.tileWidth-3, h=sq.size*this.tileHeight-3;
            ctx.fillStyle = sq.ownerColor; ctx.beginPath(); ctx.roundRect(x,y,w,h,3); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.stroke();
            const fs = Math.max(8, Math.min(26, Math.floor(this.tileHeight*(sq.size===1?0.2:0.4))));
            ctx.font = `900 ${fs}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
            let n = sq.ownerName.trim().split(' ')[0]; ctx.fillStyle='#fff'; ctx.fillText(n, x+w/2, y+h/2+10);
            if(sq.isLocked) { ctx.fillStyle='#fde047'; ctx.fillRect(x+w-20, y+2, 18, 14); ctx.fillStyle='#000'; ctx.font='bold 9px sans-serif'; ctx.fillText('🔒', x+w-11, y+9); }
          });
        }

        initWebSocket() {
          const targetId = 'milalala48';
          try {
            // Karena kita menyuntikkan script ini di dalam rumah Zerody,
            // io() akan otomatis menembus tanpa CORS blok!
            const socket = io(); 
            socket.on('connect', () => { socket.emit('setUniqueId', targetId, { enableExtendedGiftInfo: true }); });
            socket.on('setUniqueIdSuccess', () => { this.setTicker(`🟢 INJEKSI BERHASIL! Menunggu penonton @${targetId}...`); });
            socket.on('like', (d) => this.triggerTap(d.uniqueId, d.nickname, d.profilePictureUrl, '#38bdf8', d.likeCount||1));
            socket.on('gift', (d) => { if(d.giftType===1 && !d.repeatEnd) return; this.triggerGift(d.uniqueId, d.nickname, d.profilePictureUrl, '#f43f5e', (d.giftName||'').toLowerCase()); });
          } catch (err) { this.setTicker('🔴 Gagal injeksi. Refresh halaman.'); }
        }
      }

      document.getElementById('start-overlay').addEventListener('click', () => {
        if (ttsUnlocked) return; ttsUnlocked = true; getAudioContext();
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        document.getElementById('start-overlay').classList.add('hidden');
        TTS.speak('Injeksi berhasil. Siap bertempur!');
      });
      window.addEventListener('DOMContentLoaded', () => { window.gameInstance = new TurfWarGame(); });
    })();
  </script>
</body>
</html>
